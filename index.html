<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Артём | Personal Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .tag {
            font-size: 14px;
            color: #3b82f6;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .bio {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 12px 20px;
            background-color: #0f172a;
            color: #f8fafc;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #334155;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: #3b82f6;
            background-color: #1e3a8a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Аватарка (инициал А) -->
        <div class="avatar">А</div>

        <h1>Артём</h1>
        <div class="tag">@plauz</div>

        <!-- Текст о себе -->
        <p class="bio">
            Увлекаюсь технологиями, видеоиграми и автоматизацией. Люблю создавать что-то новое и экспериментировать с интересными проектами.
        </p>

        <!-- Кнопки социальных сетей -->
        <div class="links">
            <a href="https://t.me/stapblu" target="_blank" class="btn">Telegram (Личка)</a>
            <a href="https://t.me/plauz_0" target="_blank" class="btn">Telegram Channel</a>
            <a href="https://vk.ru/plauz" target="_blank" class="btn">ВКонтакте</a>
        </div>

        <div class="footer">
            2026 • Personal Profile
        </div>
    </div>

</body>
</html>
